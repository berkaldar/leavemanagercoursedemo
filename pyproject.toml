# Tool configuration only — dependencies are pinned in requirements*.txt (docs/conventions.md).
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# DTZ: naive datetimes · S608: string-built SQL (docs/conventions.md, Enforced by tooling)
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "S608"]

[tool.mypy]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser journeys (full profile only)"]
addopts = "--strict-markers"
