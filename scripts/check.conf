# scripts/check.conf — the steps behind ./scripts/check (format: scripts/check.conf.example).
# Generated at bootstrap (2026-11-07). GREENFIELD: every step below is PLANNED and commented out —
# the commands need code, and rule 1 forbids code before a spec. The walking skeleton (spec 0001)
# creates .venv, scripts/py (runs .venv/bin/python or .venv/Scripts/python.exe), the requirements
# files and pytest config, uncomments these lines, and runs the residue test on both profiles.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene) — what each step could leave behind:
# - lint: ruff is a run-once CLI (never `ruff server`, the LSP) → nothing.
# - types: mypy run-once (never `dmypy`, the daemon) → nothing. Leaves .mypy_cache (gitignored, not run state).
# - test: pytest in one process, no xdist workers; TestClient opens no port; DB is a named memory DB
#   per test → no process, no file, no rows reach the next run (rule 5).
# - e2e: uvicorn runs in a thread inside pytest (no child process); Chromium is started and closed by
#   pytest-playwright's fixtures — the one real residue risk, proven by ./scripts/residue. One worker.
#   Data: fresh seeded memory DB per test.
# - audit: pip-audit is a network query, run-once → nothing. Full-only (network + slow).
#
# Fast/full split by selector (docs/testing.md, Two speeds rule 4): `test [fast]` runs -m "not e2e",
# `e2e` runs -m e2e — the same marker, inverted.
#
# requires lint: scripts/py -c "import sys; sys.exit(sys.version_info[:2] != (3, 14))"
# requires e2e: scripts/py -c "from playwright.sync_api import sync_playwright as p; import os, sys; s = p().start(); ok = os.path.exists(s.chromium.executable_path); s.stop(); sys.exit(0 if ok else 1)"
#
# lint [fast]: scripts/py -m ruff check . && scripts/py -m ruff format --check .
# types [fast]: scripts/py -m mypy --strict app tests
# test [fast]: scripts/py -m pytest -q -m "not e2e"
# e2e: scripts/py -m pytest -q -m e2e
# audit: scripts/py -m pip_audit -r requirements.txt
